# Tự động kiểm tra & deploy lên Cloudflare mỗi khi push lên nhánh main (GitHub Actions miễn phí cho repo public/private).
# Cần 2 secrets trong GitHub repo (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - tạo từ template "Edit Cloudflare Workers" + thêm quyền "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - xem ở dashboard Cloudflare (Workers & Pages > Account ID)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build dashboard
        run: npm run build

      # Migrate trước khi deploy để code mới luôn chạy trên schema mới.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy
